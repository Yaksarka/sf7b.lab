name: Android build and core tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: bash tools/cloud/setup.sh
      - name: Build, core tests and lint
        run: bash tools/cloud/verify.sh
      - name: Upload APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf7b-lab-cloud-validation
          retention-days: 7
          path: |
            artifacts/*.apk
            core/build/test-results/test/*.xml
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
